name: Fix Expenditure Verdict Logic

on:
  push:
    paths:
      - 'scripts/fix-expenditure-verdict.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply safe patch
        run: python scripts/fix-expenditure-verdict.py

      - name: Commit patched index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Geran Tamat expenditure unachieved statistics"
          git push
